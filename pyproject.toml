[project]
name = "azx"
version = "1.0.0"
description = "Token vault and focused operator CLI for authorized Entra ID and Azure engagements"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "httpx[socks]>=0.27",
    "prompt-toolkit>=3.0",
    "requests>=2.31",
    "rich>=13.7",
    "seamlesspass==0.0.1",
]

[project.scripts]
azx = "azx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azx"]

[tool.ruff.lint.isort]
combine-as-imports = true
